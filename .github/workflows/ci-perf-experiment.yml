# TEMPORARY — measures each mobile-jest speed-up lever on real runners for the PR that adds it.
# Deleted before merge; the chosen levers land in ci.yml.
name: CI perf experiment

on:
  pull_request:
    paths:
      - ".github/workflows/ci-perf-experiment.yml"

jobs:
  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unfixed code = the PR's base (main). Fixed code = the PR head.
          - { name: "A baseline (main, npm test)",            ref: base, cache: false, cmd: "npm test" }
          - { name: "B baseline in-band (main, no fix)",      ref: base, cache: false, cmd: "npx jest --runInBand && npx jest --config jest.config.tz-negative.js --runInBand" }
          - { name: "C fix, default workers",                 ref: head, cache: false, cmd: "npm test" }
          - { name: "D fix, in-band",                         ref: head, cache: false, cmd: "npx jest --runInBand && npx jest --config jest.config.tz-negative.js --runInBand" }
          - { name: "E fix + jest transform cache",           ref: head, cache: true,  cmd: "npx jest --cacheDirectory=$GITHUB_WORKSPACE/.jest-cache && npx jest --config jest.config.tz-negative.js --cacheDirectory=$GITHUB_WORKSPACE/.jest-cache" }
          - { name: "F fix, --maxWorkers=4",                  ref: head, cache: false, cmd: "npx jest --maxWorkers=4 && npx jest --config jest.config.tz-negative.js" }
          - { name: "F2 fix, --maxWorkers=2",                 ref: head, cache: false, cmd: "npx jest --maxWorkers=2 && npx jest --config jest.config.tz-negative.js" }
          - { name: "G1 fix, shard 1/3",                      ref: head, cache: false, cmd: "npx jest --shard=1/3" }
          - { name: "G2 fix, shard 2/3",                      ref: head, cache: false, cmd: "npx jest --shard=2/3" }
          - { name: "G3 fix, shard 3/3",                      ref: head, cache: false, cmd: "npx jest --shard=3/3" }
    defaults:
      run:
        working-directory: anything/apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: anything/apps/mobile/package-lock.json

      - name: Runner size
        run: echo "cpus=$(nproc)"; free -m | head -2

      - name: Install dependencies
        run: npm ci

      - name: Restore jest cache
        if: matrix.cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-exp-${{ github.sha }}
          restore-keys: jest-exp-

      - name: Run tests
        run: ${{ matrix.cmd }}
