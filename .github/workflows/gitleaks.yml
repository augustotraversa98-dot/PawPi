name: Secret scan (gitleaks)

# Scans the commits a pull request adds for committed secrets. Separate from ci.yml on purpose: the autofix merge gate
# pins the three job names of ci.yml (scripts/autofix/gate.mjs REQUIRED_CHECKS), so this check is not one of them.
#
# Public repo => workflow logs are public. Therefore the scanner NEVER prints a finding's secret/match/line: it writes a
# JSON report (with --redact as a second layer) and only rule id, file, line and short commit are echoed below.
# Config + path-scoped allowlist for known test fixtures: .gitleaks.toml

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the whole git history instead of only the commits of the PR (informational)'
        type: boolean
        default: true

permissions:
  contents: read

# Cancel a superseded run: when a pull request gets a newer push, its older in-progress run is cancelled (the newest commit's run is the
# one that counts). The group key is the workflow name + the PR number for pull_request events; for EVERY other event (push to main,
# workflow_dispatch) it is the workflow name + the unique run id, so such runs never share a group and are NEVER cancelled or queued
# behind each other: a deploy commit on main is always fully tested. cancel-in-progress is true for pull_request events only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned release + checksum (taken from the release's own asset digest). Bump both together.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gl" gitleaks
          echo "$RUNNER_TEMP/gl" >> "$GITHUB_PATH"

      - name: Scan for secrets (values are never printed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_HISTORY: ${{ github.event.inputs.full_history }}
        run: |
          set -uo pipefail
          REPORT="$RUNNER_TEMP/gitleaks-report.json"
          if [ -n "${BASE_SHA:-}" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
            echo "Scanning the PR's commits: ${RANGE:0:7}..${RANGE: -7}"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-level error \
              --log-opts="$RANGE" --report-format json --report-path "$REPORT" . >/dev/null 2>&1
          else
            echo "Scanning the whole history (informational)"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-level error \
              --report-format json --report-path "$REPORT" . >/dev/null 2>&1
          fi
          rc=$?
          if [ "$rc" -eq 0 ]; then echo "No secrets found."; exit 0; fi
          if [ "$rc" -ne 1 ]; then echo "gitleaks failed to run (exit $rc)"; exit "$rc"; fi
          echo "::error::gitleaks found possible secrets. Rule / file / line / commit only (values deliberately not shown):"
          jq -r '.[] | [.RuleID, .File, .StartLine, .Commit[0:8]] | @tsv' "$REPORT" | sort -u
          exit 1
