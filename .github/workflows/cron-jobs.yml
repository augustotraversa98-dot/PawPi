name: Cron jobs (manual fallback)

# The schedules now live in Railway cron services (docs/ops/railway-cron.md): GitHub's cron is best-effort and was
# firing the hourly jobs only ~6x/day. This workflow is a MANUAL FALLBACK only — it has no cron trigger, so
# it can never double-fire alongside Railway. Run it from the Actions tab and pick a job.
#
# ROLLBACK to GitHub scheduling: see "Rollback" in docs/ops/railway-cron.md (pause the Railway services first or
# the jobs double-fire).

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which cron endpoint to trigger now
        type: choice
        required: true
        options:
          - weekly-digest
          - winback
          - push-receipts
          - subscriptions
          - calendar-sync

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ${{ inputs.job }}
        env:
          JOB: ${{ inputs.job }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          case "$JOB" in
            weekly-digest) path=/api/engagement/weekly-digest/run ;;
            winback)       path=/api/engagement/reengagement/run ;;
            push-receipts) path=/api/notifications/push-receipts/run ;;
            subscriptions) path=/api/payments/subscriptions/run ;;
            calendar-sync) path=/api/providers/calendar/sync ;;
            *) echo "unknown job: $JOB"; exit 1 ;;
          esac
          curl -sf --max-time 120 -X POST "https://pawpi-production.up.railway.app${path}" \
            -H "x-cron-secret: ${CRON_SECRET}"
