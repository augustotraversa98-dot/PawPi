<!-- Header lockup: mark + typeset wordmark -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<a href="/" style="display:flex;align-items:center;gap:11px;text-decoration:none">
  <img src="/logo/pawpi-paws-brown.svg" width="32" height="30" alt="PawPi">
  <span style="font-family:Nunito,sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;color:#3B241B">PawPi</span>
</a>
<!-- gap = 0.35 x 32 = 11px · wordmark cap height ~ 0.55 x 30 -->

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/logo/pawpi-app-icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/logo/pawpi-app-icon-180.png">

<!-- Splash / empty state -->
<div style="display:grid;place-items:center;min-height:60vh;background:#FFF7EF">
  <img src="/logo/pawpi-paws-brown.svg" style="width:34%;min-width:120px;max-width:240px;height:auto" alt="PawPi">
</div>

<!-- Tintable, inherits CSS color -->
<span style="color:#FF6F61">
  <img src="/logo/pawpi-paws-currentcolor.svg" width="48" alt="PawPi">
</span>
